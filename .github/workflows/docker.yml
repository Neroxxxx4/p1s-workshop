# À chaque push sur main : tests, puis image publiée sur ghcr.io/<compte>/p1s-workshop:latest
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/p1s-workshop" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          # amd64 = NAS UGREEN DXP (Intel) ; arm64 = modèles ARM
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.nom.outputs.image }}:latest
